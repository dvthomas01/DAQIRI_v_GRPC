// pipeline_fft_std.proto — standard gRPC variant (no grpc_direct.proto import).
//
// Service name, method name, and field numbers are wire-compatible with
// pipeline_fft.proto so a client compiled from the full proto can talk to a
// server compiled from this file: the client sends raw_samples (field 4) only
// on the standard path and protobuf silently ignores the missing field 1.

syntax = "proto3";
package pipeline_fft;

service PipelineFFTService {
  rpc StreamBuffers(stream BufferRequest) returns (PipelineSummary);
}

message BufferRequest {
  // field 1 (grpc_direct.FloatArray samples) intentionally absent —
  // keeps this proto free of any grpc_direct.proto dependency.
  int64 send_timestamp_ns = 2;
  int32 seq_num           = 3;
  bytes raw_samples       = 4;  // float32 array as raw bytes
}

message PipelineSummary {
  int32  buffers_received  = 1;
  double e2e_p50_us        = 2;
  double e2e_p95_us        = 3;
  double e2e_p99_us        = 4;
  double e2e_mean_us       = 5;
  double e2e_min_us        = 6;
  double e2e_max_us        = 7;
  double transfer_p50_us   = 8;
  double transfer_p95_us   = 9;
  double transfer_p99_us   = 10;
  double fft_p50_us        = 11;
  double fft_p95_us        = 12;
  double fft_p99_us        = 13;
  double throughput_mb_s   = 14;
  double cpu_util_pct      = 15;
  double gpu_util_pct      = 16;
  int32  dropped_buffers   = 17;
  string csv_path          = 18;
}
